<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0c10">
    <title>TUÍRA — motion design profissional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0c10;
            color: #eef2ff;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            overflow: hidden;
            height: 100vh;
        }

        /* LAYOUT PRINCIPAL */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* MENU SUPERIOR (estilo desktop) */
        .menu-bar {
            background: #111418;
            border-bottom: 1px solid #2a2f38;
            display: flex;
            gap: 2px;
            padding: 0 12px;
            height: 36px;
            align-items: center;
            font-size: 12px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .menu-item {
            position: relative;
            padding: 0 12px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.1s;
            color: #cbd5e1;
        }
        .menu-item:hover {
            background: #1e242c;
            color: white;
        }
        .menu-dropdown {
            position: absolute;
            top: 36px;
            left: 0;
            background: #141a22;
            border: 1px solid #2a2f38;
            border-radius: 8px;
            min-width: 180px;
            z-index: 2000;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            padding: 6px 0;
        }
        .menu-dropdown a, .menu-dropdown button {
            background: none;
            border: none;
            text-align: left;
            padding: 6px 16px;
            color: #e2e8f0;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
        }
        .menu-dropdown a:hover, .menu-dropdown button:hover {
            background: #2a313c;
            color: #f5d547;
        }
        .menu-item.active .menu-dropdown {
            display: flex;
        }

        /* TOOLBAR (estilo Fusion) */
        .toolbar {
            background: #0f1217;
            border-bottom: 1px solid #1f2329;
            padding: 6px 12px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
            flex-shrink: 0;
        }
        .tool-btn {
            background: #181e26;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            color: #cbd5e6;
            font-size: 11px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .tool-btn.active {
            background: #f5d547;
            color: #0a0c10;
        }
        .tool-btn:hover {
            background: #2a313c;
            color: white;
        }
        .separator {
            width: 1px;
            height: 24px;
            background: #2a2f38;
            margin: 0 6px;
        }

        /* GRID PRINCIPAL igual ao antigo mas com ajuste */
        .workspace {
            display: grid;
            grid-template-columns: 200px 1fr 280px 300px;
            grid-template-rows: 1fr 220px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .layers-panel { grid-column: 1 / 2; grid-row: 1 / 3; background: #0d1117; border-right: 1px solid #1f2329; display: flex; flex-direction: column; overflow: hidden; }
        .stage-area { grid-column: 2 / 3; grid-row: 1 / 2; background: radial-gradient(ellipse at 30% 40%, #12161e, #080b0f); position: relative; overflow: hidden; border-bottom: 1px solid #2a2f38; }
        .inspector { grid-column: 3 / 4; grid-row: 1 / 3; background: #0d1117; border-left: 1px solid #1f2329; border-right: 1px solid #1f2329; overflow-y: auto; }
        .timeline-area { grid-column: 2 / 3; grid-row: 2 / 3; background: #0a0d12; display: flex; flex-direction: column; overflow: hidden; }
        .ai-sidebar { grid-column: 4 / 5; grid-row: 1 / 3; background: #0b0e13; border-left: 1px solid #1f2329; display: flex; flex-direction: column; overflow: hidden; }

        /* LAYERS */
        .layers-header { padding: 10px; border-bottom: 1px solid #1f2329; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .layer-list { flex: 1; overflow-y: auto; padding: 6px; }
        .layer-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; background: #10141c; }
        .layer-item.selected { background: #1e2a3a; border-left: 2px solid #f5d547; }
        .layer-swatch { width: 12px; height: 12px; border-radius: 2px; }
        .layer-name { flex: 1; font-size: 11px; }

        /* STAGE CANVAS */
        .stage-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 1px #2a2f38, 0 20px 40px rgba(0,0,0,0.4); background: #000; }

        /* TIMELINE */
        .timeline-ruler { height: 24px; background: #0f1219; border-bottom: 1px solid #2a2f38; position: relative; overflow-x: auto; }
        .timeline-tracks { flex: 1; overflow-y: auto; position: relative; }
        .playhead { position: absolute; top: 0; width: 2px; background: #f5d547; pointer-events: none; z-index: 20; }

        /* INSPECTOR */
        .inspector-section { border-bottom: 1px solid #1f2329; padding: 12px; }
        .prop-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .prop-label { width: 70px; font-size: 10px; color: #94a3b8; }

        /* EFECTOS (node-like) */
        .effects-list { margin-top: 12px; }
        .effect-card { background: #10141c; border-radius: 8px; padding: 8px; margin-bottom: 8px; border-left: 3px solid #f5d547; }

        /* GAUSSIAN SPLATTING preview */
        .splat-canvas { width: 100%; height: 120px; background: #000; border-radius: 8px; margin-top: 8px; }

        /* RESPONSIVO */
        @media (max-width: 1000px) {
            .workspace { grid-template-columns: 160px 1fr 240px; }
            .ai-sidebar { display: none; }
        }
        @media (max-width: 760px) {
            .workspace { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
            .layers-panel, .inspector, .timeline-area { border: none; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Menu Bar -->
    <div class="menu-bar" id="menuBar">
        <div class="menu-item" data-menu="file">Arquivo
            <div class="menu-dropdown">
                <button id="newProjectBtn">Novo Projeto</button>
                <button id="saveProjectBtn">Salvar Projeto (.tuira)</button>
                <button id="loadProjectBtn">Abrir Projeto...</button>
                <hr style="margin:4px 0;border-color:#2a2f38">
                <button id="exportVideoBtn">Exportar Vídeo (MP4)</button>
            </div>
        </div>
        <div class="menu-item" data-menu="edit">Editar
            <div class="menu-dropdown">
                <button id="undoBtn">Desfazer (em breve)</button>
                <button id="redoBtn">Refazer</button>
                <button id="deleteSelectedBtn">Excluir Selecionado</button>
            </div>
        </div>
        <div class="menu-item" data-menu="objects">Objetos
            <div class="menu-dropdown">
                <button data-add="rect">Retângulo</button>
                <button data-add="ellipse">Elipse</button>
                <button data-add="poly">Polígono</button>
                <button data-add="text">Texto</button>
                <button data-add="cloner">Cloner</button>
                <button data-add="splat">Splat Field (Gaussian Splatting)</button>
                <button data-add="path">Curva Bézier (Path)</button>
            </div>
        </div>
        <div class="menu-item" data-menu="effects">Efeitos
            <div class="menu-dropdown">
                <button id="addBlurEffect">Blur</button>
                <button id="addGlowEffect">Glow</button>
                <button id="addDisplaceEffect">Displace (Noise)</button>
                <button id="addParticleEffect">Partículas (Sistema)</button>
            </div>
        </div>
        <div class="menu-item" data-menu="window">Janela
            <div class="menu-dropdown">
                <button id="toggleInspector">Inspector</button>
                <button id="toggleTimeline">Linha do tempo</button>
            </div>
        </div>
        <div class="menu-item" data-menu="help">Ajuda
            <div class="menu-dropdown">
                <a href="#" id="tutorialLink">Tutorial no YouTube</a>
                <button id="aboutBtn">Sobre TUÍRA</button>
            </div>
        </div>
    </div>

    <!-- Toolbar estilo Fusion -->
    <div class="toolbar" id="mainToolbar">
        <button class="tool-btn" data-tool="select" id="toolSelect">🔍 Selecionar</button>
        <button class="tool-btn" data-tool="pen" id="toolPen">✒️ Caneta Bézier</button>
        <button class="tool-btn" data-tool="editPath" id="toolEditPath">✏️ Editar Caminho</button>
        <div class="separator"></div>
        <button class="tool-btn" id="addRectBtn">➕ Retângulo</button>
        <button class="tool-btn" id="addSplineBtn">📐 Spline</button>
        <div class="separator"></div>
        <button class="tool-btn" id="zoomFitBtn">⛶ Ajustar</button>
    </div>

    <!-- Workspace grid -->
    <div class="workspace">
        <div class="layers-panel">
            <div class="layers-header">📁 CAMADAS</div>
            <div class="layer-list" id="layerListPanel"></div>
        </div>
        <div class="stage-area" id="stageContainer">
            <canvas id="mainCanvas" class="stage-canvas" width="1080" height="1080"></canvas>
            <div class="zoom-pad" style="position:absolute; bottom:12px; right:12px; background:#1e1e2a; border-radius:8px; padding:4px; display:flex; gap:4px;">
                <button id="zoomOutBtn">−</button><span id="zoomValue" style="padding:0 8px">100%</span><button id="zoomInBtn">+</button>
            </div>
        </div>
        <div class="inspector" id="inspectorPanel">
            <div style="padding:12px"><strong>Inspector</strong><br><span id="selectedInfo">Nenhum</span></div>
            <div id="inspectorDynamic"></div>
            <div id="effectsContainer" class="inspector-section"><h4>⚡ Efeitos (nó)</h4><div id="effectsList"></div><button id="addEffectBtn" style="background:#2a313c; padding:4px 8px; border-radius:6px; margin-top:6px">+ Adicionar Efeito</button></div>
        </div>
        <div class="timeline-area">
            <div class="timeline-ruler" id="rulerArea" style="overflow-x:auto; white-space:nowrap;"></div>
            <div class="timeline-tracks" id="timelineTracks" style="overflow-y:auto; flex:1; min-height:0;"></div>
            <div class="playhead" id="timelinePlayhead" style="height:100%;"></div>
        </div>
        <div class="ai-sidebar">
            <div style="padding:12px;border-bottom:1px solid #1f2329">🤖 Claude AI (Conecte)</div>
            <div style="flex:1; overflow-y:auto; padding:8px" id="chatMessages"></div>
            <textarea id="aiPrompt" placeholder="Descreva animação..." style="width:100%; background:#141a22; border:none; padding:8px; color:white; resize:none;"></textarea>
            <button id="sendAiBtn" style="margin:6px; background:#f5d547; color:#000">Enviar</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------------------------- ENGINE CORE (baseado no original, renomeado) ----------------------------
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let S = {
            comp: { w:1080, h:1080, fps:30, frames:120 },
            frame: 0, playing: false, zoom: 1,
            layers: [], selectedId: null,
            nextId: 1, tlPxPerFrame: 6,
            effectsLib: [],   // efeitos globais? por layer
            paths: [],        // curvas Bézier salvas
            activeTool: 'select'
        };
        const PAL = ['#f5d547','#5ac8fa','#ff5e3a','#a6f539','#b48cff','#ff8fb1'];

        // Tipos de layers + schemas
        const baseProps = {x:S.comp.w/2,y:S.comp.h/2,sx:1,sy:1,rot:0,opacity:100};
        function makeNode(type){
            const id = 'n'+S.nextId++;
            const col = PAL[S.layers.length % PAL.length];
            let node = { id, type, name: `${type}_${id}`, color: col, visible: true, props: {...baseProps}, keys: {}, effects: [] };
            if(type==='rect'){ node.props.w=200; node.props.h=150; node.props.fill=col; node.props.strokeOn=false; }
            else if(type==='ellipse'){ node.props.rx=100; node.props.ry=100; node.props.fill=col; }
            else if(type==='poly'){ node.props.sides=5; node.props.rad=100; node.props.fill=col; }
            else if(type==='text'){ node.props.text='TUÍRA'; node.props.size=80; node.props.fill=col; node.props.family='Instrument Serif'; }
            else if(type==='cloner'){ node.props.mode='radial'; node.props.count=12; node.props.radius=280; node.props.size=40; node.props.fill=col; node.props.shape='ellipse'; }
            else if(type==='splat'){ node.props.count=800; node.props.size=4; node.props.hueShift=0; node.props.fill=col; }
            else if(type==='path'){ node.props.points=[[540,540],[640,540],[640,640],[540,640]]; node.props.closed=false; }
            return node;
        }
        function res(node,prop,f){ let k=node.keys[prop]; if(k && k.length){ let val=valueAt(node,prop,f); return val!==undefined?val:node.props[prop]; } return node.props[prop]; }
        function valueAt(node,prop,frame){
            let ks=node.keys[prop]; if(!ks) return node.props[prop];
            if(frame<=ks[0].f) return ks[0].v;
            if(frame>=ks[ks.length-1].f) return ks[ks.length-1].v;
            for(let i=0;i<ks.length-1;i++){ let a=ks[i],b=ks[i+1]; if(frame>=a.f && frame<=b.f){ let t=(frame-a.f)/(b.f-a.f); return a.v+(b.v-a.v)*t; } }
            return node.props[prop];
        }
        function setKey(node,prop,f,v){ if(!node.keys[prop]) node.keys[prop]=[]; let ks=node.keys[prop]; let idx=ks.findIndex(k=>k.f===f); if(idx>=0) ks[idx].v=v; else { ks.push({f,v}); ks.sort((a,b)=>a.f-b.f); } }
        // renderização principal
        function renderScene(){
            ctx.clearRect(0,0,S.comp.w,S.comp.h);
            ctx.fillStyle='#000'; ctx.fillRect(0,0,S.comp.w,S.comp.h);
            for(let i=S.layers.length-1;i>=0;i--){ let l=S.layers[i]; if(l.visible) drawLayer(l,S.frame); }
            applyPostEffects(); // efeitos de tela (glow, blur)
        }
        function drawLayer(l,frame){
            let p=k=>res(l,k,frame);
            ctx.save();
            ctx.globalAlpha=p('opacity')/100;
            ctx.translate(p('x'),p('y'));
            ctx.rotate(p('rot')*Math.PI/180);
            ctx.scale(p('sx'),p('sy'));
            if(l.type==='rect'){ let w=p('w'),h=p('h'); ctx.fillStyle=p('fill'); ctx.fillRect(-w/2,-h/2,w,h); if(p('strokeOn')){ ctx.strokeStyle=p('stroke'); ctx.lineWidth=p('strokeW'); ctx.strokeRect(-w/2,-h/2,w,h); } }
            else if(l.type==='ellipse'){ ctx.fillStyle=p('fill'); ctx.beginPath(); ctx.ellipse(0,0,p('rx'),p('ry'),0,0,Math.PI*2); ctx.fill(); }
            else if(l.type==='poly'){ let sides=p('sides'),rad=p('rad'); ctx.fillStyle=p('fill'); ctx.beginPath(); for(let i=0;i<sides;i++){ let a=-Math.PI/2+(i*Math.PI*2/sides); let x=Math.cos(a)*rad,y=Math.sin(a)*rad; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.closePath(); ctx.fill(); }
            else if(l.type==='text'){ ctx.font=`${p('italic')?'italic ':''}${p('weight')||'600'} ${p('size')}px ${p('family')||'Inter'}`; ctx.fillStyle=p('fill'); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p('text'),0,0); }
            else if(l.type==='cloner'){ drawCloner(l,frame); }
            else if(l.type==='splat'){ drawSplatField(l,frame); }
            else if(l.type==='path'){ drawPathShape(l,frame); }
            ctx.restore();
        }
        function drawCloner(l,f){
            let p=k=>res(l,k,f); let count=Math.max(1,p('count')); let rad=p('radius'); let step=360/count;
            for(let i=0;i<count;i++){ let ang=i*step*Math.PI/180; let x=Math.cos(ang)*rad,y=Math.sin(ang)*rad; ctx.save(); ctx.translate(x,y); ctx.fillStyle=p('fill'); ctx.beginPath(); ctx.ellipse(0,0,p('size')/2,p('size')/2,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
        }
        function drawSplatField(l,f){
            let p=k=>res(l,k,f); let count=Math.min(2000,p('count')); let size=p('size'); let time=Date.now()*0.002;
            for(let i=0;i<count;i++){ let angle=i*17.3; let x=((Math.sin(angle*0.2+time)*0.5+0.5)*S.comp.w); let y=((Math.cos(angle*0.13+time*0.7)*0.5+0.5)*S.comp.h); let hue=(angle*2+time*50)%360; ctx.fillStyle=`hsl(${hue},70%,60%)`; ctx.beginPath(); ctx.arc(x,y,size*0.8,0,Math.PI*2); ctx.fill(); }
        }
        function drawPathShape(l,f){ let pts=l.props.points||[]; if(pts.length<2)return; ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.strokeStyle=l.props.fill||'#f5d547'; ctx.lineWidth=3; ctx.stroke(); }
        function applyPostEffects(){
            // blur/glow placeholder (aplica filtro simples)
            if(window._tempEffect && window._tempEffect.blur){ ctx.filter=`blur(${window._tempEffect.blur}px)`; ctx.drawImage(canvas,0,0); ctx.filter='none'; }
        }
        // timeline/interface
        function refreshUI(){ renderScene(); updateLayersPanel(); updateInspector(); updateTimeline(); updatePlayhead(); }
        function updateLayersPanel(){ let panel=document.getElementById('layerListPanel'); if(!panel)return; panel.innerHTML=''; S.layers.forEach(l=>{ let div=document.createElement('div'); div.className='layer-item'+(S.selectedId===l.id?' selected':''); div.innerHTML=`<div class="layer-swatch" style="background:${l.color}"></div><span class="layer-name">${l.name}</span>`; div.onclick=()=>{ S.selectedId=l.id; refreshUI(); }; panel.appendChild(div); }); }
        function updateInspector(){ let dyn=document.getElementById('inspectorDynamic'); if(!dyn)return; let sel=S.layers.find(l=>l.id===S.selectedId); if(!sel){ dyn.innerHTML='<div>Nenhum objeto selecionado</div>'; return; } dyn.innerHTML=`<div><strong>${sel.name}</strong> (${sel.type})</div><div class="prop-row"><span class="prop-label">X</span><input type="range" min="0" max="${S.comp.w}" value="${sel.props.x}" data-prop="x" step="1"></div><div class="prop-row"><span class="prop-label">Y</span><input type="range" min="0" max="${S.comp.h}" value="${sel.props.y}" data-prop="y"></div><div class="prop-row"><span class="prop-label">Rotação</span><input type="range" min="-180" max="180" value="${sel.props.rot}" data-prop="rot"></div><div class="prop-row"><span class="prop-label">Opacidade</span><input type="range" min="0" max="100" value="${sel.props.opacity}" data-prop="opacity"></div><div class="prop-row"><span class="prop-label">Fill</span><input type="color" value="${sel.props.fill||'#f5d547'}" data-prop="fill"></div>`;
            dyn.querySelectorAll('input').forEach(inp=>{ inp.addEventListener('change',e=>{ sel.props[inp.dataset.prop]=parseFloat(inp.value); if(inp.dataset.prop==='fill') sel.color=inp.value; refreshUI(); }); });
        }
        function updateTimeline(){ let tracksDiv=document.getElementById('timelineTracks'); if(!tracksDiv)return; tracksDiv.innerHTML=''; for(let l of S.layers){ let row=document.createElement('div'); row.style.height='22px'; row.style.borderBottom='1px solid #1f2329'; row.style.position='relative'; let keysTotal=Object.keys(l.keys).length; row.innerHTML=`<span style="padding-left:8px; font-size:10px;">${l.name}</span>`; tracksDiv.appendChild(row); } }
        function updatePlayhead(){ let ph=document.getElementById('timelinePlayhead'); if(ph) ph.style.left=(S.frame*S.tlPxPerFrame)+'px'; }
        function addLayer(type){ let n=makeNode(type); S.layers.unshift(n); S.selectedId=n.id; refreshUI(); }
        // salvar/restaurar projeto
        function saveProject(){ let data={version:'TUIRA_1',comp:S.comp,layers:S.layers,frame:S.frame,nextId:S.nextId}; let json=JSON.stringify(data); let blob=new Blob([json],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='projeto.tuira'; a.click(); }
        function loadProject(file){ let reader=new FileReader(); reader.onload=e=>{ let data=JSON.parse(e.target.result); S.comp=data.comp; S.layers=data.layers; S.frame=data.frame||0; S.nextId=data.nextId; refreshUI(); }; reader.readAsText(file); }
        document.getElementById('saveProjectBtn').onclick=saveProject;
        document.getElementById('loadProjectBtn').onclick=()=>{ let inp=document.createElement('input'); inp.type='file'; inp.accept='.json,.tuira'; inp.onchange=e=>loadProject(inp.files[0]); inp.click(); };
        document.getElementById('newProjectBtn').onclick=()=>{ S.layers=[]; S.frame=0; refreshUI(); };
        // efeitos (blur, glow etc)
        document.getElementById('addBlurEffect').onclick=()=>{ if(S.selectedId){ let layer=S.layers.find(l=>l.id===S.selectedId); if(layer){ layer.effects.push({type:'blur',intensity:5}); refreshUI(); } } };
        document.getElementById('addGlowEffect').onclick=()=>{ if(S.selectedId){ let layer=S.layers.find(l=>l.id===S.selectedId); layer.effects.push({type:'glow',strength:8}); refreshUI(); } };
        // ferramenta caneta (adicionar pontos ao path)
        let drawingPath=false, tempPoints=[];
        function enablePenTool(){ S.activeTool='pen'; canvas.style.cursor='crosshair'; }
        function onCanvasClick(e){ if(S.activeTool==='pen'){ let rect=canvas.getBoundingClientRect(); let scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height; let x=(e.clientX-rect.left)*scaleX, y=(e.clientY-rect.top)*scaleY; tempPoints.push([x,y]); if(tempPoints.length>1){ let pathLayer=S.layers.find(l=>l.type==='path' && l.id===S.selectedId); if(!pathLayer){ let newPath=makeNode('path'); newPath.props.points=tempPoints.slice(); S.layers.unshift(newPath); S.selectedId=newPath.id; } else { pathLayer.props.points=tempPoints.slice(); } refreshUI(); } } }
        canvas.addEventListener('click',onCanvasClick);
        document.getElementById('toolPen').onclick=enablePenTool;
        document.getElementById('toolSelect').onclick=()=>{ S.activeTool='select'; canvas.style.cursor='default'; };
        // zoom
        function setZoom(z){ S.zoom=Math.min(4,Math.max(0.2,z)); let style=canvas.style; let baseW=S.comp.w,baseH=S.comp.h; style.width=(baseW*S.zoom)+'px'; style.height=(baseH*S.zoom)+'px'; document.getElementById('zoomValue').innerText=Math.round(S.zoom*100)+'%'; refreshUI(); }
        document.getElementById('zoomInBtn').onclick=()=>setZoom(S.zoom*1.2);
        document.getElementById('zoomOutBtn').onclick=()=>setZoom(S.zoom/1.2);
        document.getElementById('zoomFitBtn').onclick=()=>{ let container=document.getElementById('stageContainer'); let ratio=Math.min(container.clientWidth/S.comp.w, container.clientHeight/S.comp.h); setZoom(ratio*0.9); };
        // controles de tempo
        let animFrame; function playAnim(){ if(S.playing) return; S.playing=true; function step(){ if(!S.playing) return; S.frame=(S.frame+1)%S.comp.frames; refreshUI(); requestAnimationFrame(step); } requestAnimationFrame(step); }
        document.getElementById('exportVideoBtn').onclick=()=>alert('Exportação avançada via MediaRecorder (demo)');
        document.getElementById('deleteSelectedBtn').onclick=()=>{ if(S.selectedId){ S.layers=S.layers.filter(l=>l.id!==S.selectedId); S.selectedId=null; refreshUI(); } };
        document.getElementById('addRectBtn').onclick=()=>addLayer('rect');
        document.getElementById('addSplineBtn').onclick=()=>addLayer('path');
        // gaussian splatting visual
        function drawGaussianDemo(){ let splatLayer=S.layers.find(l=>l.type==='splat'); if(splatLayer){ drawSplatField(splatLayer,S.frame); } }
        // tutorial link
        document.getElementById('tutorialLink').onclick=()=>window.open('https://youtu.be/dQw4w9WgXcQ','_blank');
        // AI mock (Claude substituído por simulação local)
        document.getElementById('sendAiBtn').onclick=()=>{ let prompt=document.getElementById('aiPrompt').value; if(prompt){ let msgDiv=document.getElementById('chatMessages'); msgDiv.innerHTML+=`<div style="background:#1e242c; margin:4px; padding:6px; border-radius:6px;"><b>Você:</b> ${prompt}</div>`; msgDiv.innerHTML+=`<div style="background:#2a313c; margin:4px; padding:6px; border-radius:6px;"><b>AI:</b> Comando recebido: criando nova camada e keyframes.</div>`; if(prompt.includes('círculo')) addLayer('ellipse'); else if(prompt.includes('texto')) addLayer('text'); else addLayer('rect'); document.getElementById('aiPrompt').value=''; refreshUI(); } };
        // inicialização
        window.addEventListener('resize',()=>{ setZoom(S.zoom); });
        refreshUI(); setZoom(1);
        // sistema de efeitos node (demo)
        document.getElementById('addEffectBtn').onclick=()=>{ alert('Editor de nós em desenvolvimento: adicione blur/glow pelo menu Efeitos'); };
        // simular gaussian splatting ativo
        setInterval(()=>{ if(S.layers.some(l=>l.type==='splat')) renderScene(); }, 40);
    })();
</script>
</body>
</html>
